[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.1.19"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = {file = "LICENSE"}
dependencies = [
    "flwr[simulation]>=1.36.0",
    "torch==2.5.1",
    "pandas",
    "numpy",
    "dppy",
]

[tool.hatch.build.targets.wheel]
packages = ["pytorchexample"]
include = [
    "pytorchexample/**/*.csv",
    "pytorchexample/**/*.py",
]

[tool.flwr.app]
publisher = "flwrlabs"
fab-format-version = 1
flwr-version-target = "1.42.0"

[tool.flwr.app.components]
serverapp = "pytorchexample.server_app:app"
clientapp = "pytorchexample.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 100
learning-rate = 0.0005
fraction-fit = 0.04
sigma = 2.0
alpha = 0.5
centrality-type = "degree"     # pagerank or degree
sampling-mode = "random"       # dpp or random
save-model = true
local-epochs = 2
local-steps = 10
hidden-dim = 16
batch-size = 32
target-accuracy = 95.0

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true



